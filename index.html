<style>
:root{--bg:#f6f7f9;--panel:#fff;--line:#e4e6ea;--text:#20242a;--muted:#707780;--accent:#5b67f1;--ok:#35b66a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#080d1c;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif}
.container{width:min(1100px,100%);margin:auto;padding:14px 14px 40px}
.header{background:transparent;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #0000000a}
.brand{font-weight:900;font-size:20px;letter-spacing:.2px;color:#fff;text-align:center}
.version{color:#fff;font-size:12px;margin-top:2px}
.stats{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.counter{font-size:22px;font-weight:900;color:#fff}
.badge{color:#fff;font-size:13px}
.progress{height:10px;background:#e8eaee;border-radius:99px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.tools{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:13px}
.tools button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-weight:700;color:var(--text);cursor:pointer}
.tools button.active{background:#e53935;border-color:#e53935;color:#fff}
.tools .primary{background:var(--accent);border-color:var(--accent);color:#fff}
.category-buttons{margin-top:6px}
.stage-wrap{width:min(100%,1254px);margin:auto}
.stage{display:none;position:relative;width:100%;aspect-ratio:1/1;isolation:isolate;background:url("background.jpg") center top/100% 100% no-repeat;overflow:hidden}
.stage.active{display:block}
.spirit{position:absolute;background:transparent;border:0;border-radius:0;padding:0;box-shadow:none;transform:translate(-50%,-50%);z-index:2}
.spirit.hidden{visibility:hidden !important;pointer-events:none}
.sprite{position:relative;width:100%;padding:0;border:0;border-radius:0;background:transparent;overflow:visible;cursor:pointer}
.sprite img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:contain;opacity:1!important;transition:none}
.mark{display:none}
.spirit.on .mark{display:flex;position:absolute;inset:0;align-items:center;justify-content:center;font-size:80px;font-weight:900;color:#e53935;text-shadow:0 0 8px #000;pointer-events:none;z-index:10;background:transparent}
.spirit-name{text-align:center;font-weight:900;font-size:14px;color:#000;-webkit-text-stroke:2px #fff;paint-order:stroke fill;padding:3px 4px;position:relative;left:-25px}
.hint{text-align:center;color:#fff;font-size:12px;margin-top:8px;opacity:.85}
#completeOverlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.45);align-items:center;justify-content:center;flex-direction:column;pointer-events:none}
#completeOverlay.show{display:flex}
.completeText{font-size:clamp(60px,10vw,120px);font-weight:900;color:#fff;white-space:nowrap;text-shadow:4px 4px 0 #e53935,0 0 15px #fff,0 0 30px #ff9800;animation:completePop .6s ease-out}
@keyframes completePop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@media(max-width:800px){
 .container{padding:9px}
 .brand{font-size:18px}
 .counter{font-size:19px}
 .tools button{padding:8px 10px;font-size:12px}
 .spirit-name{font-size:8px;left:0}
 .spirit.on .mark{font-size:40px}
}
@media(max-width:600px){
 .container{padding:7px}
 .header{padding:13px}
 .stage-wrap{width:100%}
}
</style>

<div class="hint">精霊をクリックすると取得済みにできます。チェック状態はこの端末に保存されます。</div>
</div>

<div id="completeOverlay">
  <div class="completeText">コンプリート！</div>
</div>

<script>
const key='fortnite-spirit-checklist-user-v4';
const state={};
let category='new';
let view='all';
let completeTimer=null;

function allSpiritElements(){
  return [...document.querySelectorAll('.spirit')];
}

function load(){
  try{
    Object.assign(state,JSON.parse(localStorage.getItem(key)||'{}'));
  }catch(e){}
}

function saveState(){
  try{
    localStorage.setItem(key,JSON.stringify(state));
    document.getElementById('saved').textContent='保存済み';
  }catch(e){
    document.getElementById('saved').textContent='この端末に保存できません';
  }
}

function categoryIds(v){
  if(v==='new') return [...document.querySelectorAll('#stage-new .spirit')].map(x=>x.dataset.id);
  if(v==='bounty') return [...document.querySelectorAll('#stage-bounty .spirit')].map(x=>x.dataset.id);
  return [...document.querySelectorAll('#stage-all .spirit')].map(x=>x.dataset.id);
}

function currentIds(){
  return categoryIds(category);
}

function isOwned(id){ return !!state[id]; }

function addNames(){
  document.querySelectorAll('.spirit').forEach(el=>{
    if(el.querySelector('.spirit-name')) return;
    const name=el.dataset.id;
    const div=document.createElement('div');
    div.className='spirit-name';
    div.textContent=name;
    el.appendChild(div);
  });
}

function filter(){
  const visibleStage=document.getElementById('stage-'+category);
  allSpiritElements().forEach(el=>{
    const inCurrent=el.closest('.stage')===visibleStage;
    const owned=isOwned(el.dataset.id);
    const ok=view==='all'||(view==='missing'&&!owned)||(view==='owned'&&owned);
    el.classList.toggle('hidden',!(inCurrent&&ok));
    el.classList.toggle('on',owned);
  });
}

function update(){
  const ids=currentIds();
  const owned=ids.filter(isOwned).length;
  const total=ids.length;
  document.getElementById('counter').textContent=owned+' / '+total;
  document.getElementById('bar').style.width=(total?owned/total*100:0)+'%';
  filter();
  if(owned===total) showComplete();
  else hideComplete();
}

function showComplete(){
  const ov=document.getElementById('completeOverlay');
  if(completeTimer) clearTimeout(completeTimer);
  ov.classList.add('show');
  completeTimer=setTimeout(()=>ov.classList.remove('show'),5000);
}

function hideComplete(){
  document.getElementById('completeOverlay').classList.remove('show');
}

function setCategory(v){
  category=v;
  document.querySelectorAll('#categoryButtons button').forEach(b=>b.classList.toggle('active',b.dataset.category===v));
  document.querySelectorAll('.stage').forEach(s=>s.classList.toggle('active',s.id==='stage-'+v));
  update();
}

function setView(v){
  view=v;
  document.querySelectorAll('#viewButtons button[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  filter();
}

allSpiritElements().forEach(el=>{
  const btn=el.querySelector('.sprite');
  btn.addEventListener('click',()=>{
    const id=el.dataset.id;
    state[id]=!state[id];
    saveState();
    update();
  });
});

document.querySelectorAll('#categoryButtons button').forEach(b=>b.addEventListener('click',()=>setCategory(b.dataset.category)));
document.querySelectorAll('#viewButtons button[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));

document.getElementById('resetBtn').addEventListener('click',()=>{
  if(!confirm('すべてのチェックを解除しますか？')) return;
  Object.keys(state).forEach(k=>state[k]=false);
  saveState();
  update();
});

async function saveImage(){
  const stage=document.getElementById('stage-'+category);
  if(!stage) return;
  const hidden=[...stage.querySelectorAll('.spirit.hidden')];
  hidden.forEach(x=>x.classList.remove('hidden'));
  try{
    const canvas=await html2canvas(stage,{
      backgroundColor:null,
      useCORS:true,
      scale:window.devicePixelRatio
    });
    const a=document.createElement('a');
    a.href=canvas.toDataURL('image/png');
    a.download='fortnite-'+category+'-'+view+'.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }catch(e){
    alert('画像の保存に失敗しました');
  }finally{
    hidden.forEach(x=>x.classList.add('hidden'));
    filter();
  }
}

document.getElementById('saveBtn').addEventListener('click',saveImage);

load();
addNames();
update();
setCategory('new');
setView('all');
</script>
