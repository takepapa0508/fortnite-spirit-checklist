<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="FORTNITE 精霊チェックリスト 精霊リスト">
<meta name="robots" content="index,follow">
<title> 戦利品ハッカー精霊チェックリスト</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--line:#e4e6ea;--text:#20242a;--muted:#707780;--accent:#5b67f1;--ok:#35b66a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background: url("background-v2.png") center center / cover fixed;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif}
@media (max-width:600px){
  body{
    background-image:url("background-mobile.png");
  }
  .brand{transform:translateY(45px)}
}
.container{width:min(1100px,100%);margin:auto;padding:14px 14px 40px}
.header{background:transparent;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #0000000a}
.brand{font-weight:900;font-size:20px;letter-spacing:.2px;color:#fff;}
.version{color:#fff;font-size:12px;margin-top:2px}
.stats{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.counter{font-size:22px;font-weight:900;color:#fff}
.badge{color:#fff;font-size:13px}
.progress{height:10px;background:#e8eaee;border-radius:99px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.tools button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-weight:700;color:var(--text);cursor:pointer}
.tools button.active{background:#e53935;border-color:#e53935;color:#fff}
.tools .primary{background:var(--accent);border-color:var(--accent);color:#fff}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.filters input,.filters select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.spirit{background:transparent;border:0;border-radius:0;padding:0;box-shadow:none}
.sprite{position:relative;width:100%;padding:0;border:0;border-radius:0;background:transparent;overflow:visible;cursor:pointer}
.sprite img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain}
.mark{display:none}
.spirit.on .mark{background:var(--ok);border-color:var(--ok);color:#fff}
.spirit img{opacity:.55;transition:opacity .2s}
.spirit.on img{opacity:1}
.spirit.on{border-color:#e53935;box-shadow:0 0 0 2px #e5393533}
.spirit.on::after{display:none}
.spirit-name{
  text-align:center;
  font-weight:900;
  font-size:14px;
  color:#fff;
  padding:8px 4px 3px;
}
.hidden{display:none!important}
@media(max-width:800px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(max-width:560px){.container{padding:9px}.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.header{border-radius:14px;padding:13px}.counter{font-size:19px}}
@media(max-width:390px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(max-width:600px){
  .header .brand{
    transform:translateX(30px);
  }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
<div class="container">
<section class="header">
<div class="brand"> 戦利品ハッカー精霊チェックリスト</div>
<div class="stats"><span class="counter" id="counter">0 / 15</span><span class="badge" id="saved">保存済み</span></div>
<div class="progress"><i id="bar"></i></div>
<div class="tools">
<button onclick="setView('all')">すべて</button>
<button onclick="setView('missing')">未取得</button>
<button onclick="setView('owned')">取得済み</button>
<button class="primary" onclick="saveImage()">画像保存</button>
<button onclick="resetAll()">すべて解除</button>
</div>

</section>

  <article class="spirit" data-i="1">

  <article class="spirit" data-i="15">

    </button>
  </article>
</main>
</div>
<script>
const key='fortnite-spirit-checklist-user-v1';
const spirits=[...document.querySelectorAll('.spirit')];
const spiritNames=[
  'ジャックラビット',
  '冒険',
  'クラウン',
  '８ビット',
  'ブッシュ',
  'キルスイッチ',
  'ジョンジー',
  'ストームスカウト',
  'クロムボ',
  'シャドウ',
  'テイルス',
  'ソニック',
  'オーバーシールド',
  'Ｘ線',
  'おにぎり'
];

spirits.forEach((s,i)=>{
  const name=document.createElement('div');
  name.className='spirit-name';
  name.textContent=spiritNames[i];
  s.appendChild(name);
});
let view='all';
function state(){return spirits.map(x=>x.classList.contains('on'))}
function update(){let a=state(),n=a.filter(Boolean).length,p=Math.round(n/15*100);document.getElementById('counter').textContent=n+' / 15';document.getElementById('bar').style.width=p+'%';try{localStorage.setItem(key,JSON.stringify(a));document.getElementById('saved').textContent='保存済み'}catch(e){document.getElementById('saved').textContent='この端末に保存できません'}}
function load(){try{let a=JSON.parse(localStorage.getItem(key)||'[]');spirits.forEach((s,i)=>s.classList.toggle('on',!!a[i]))}catch(e){}update()}
spirits.forEach(s=>s.querySelector('.sprite').addEventListener('click',()=>{s.classList.toggle('on');update();filter()}));
function setView(v){
  view=v;
  filter();
  const buttons=document.querySelectorAll('.tools button');
  buttons[0].classList.toggle('active',v==='all');
  buttons[1].classList.toggle('active',v==='missing');
  buttons[2].classList.toggle('active',v==='owned');
}
function filter(){
  spirits.forEach(s=>{
    const on=s.classList.contains('on');
    const ok=view==='all'||(view==='missing'&&!on)||(view==='owned'&&on);
    s.classList.toggle('hidden',!ok);
  });
}
function resetAll(){if(confirm('チェックをすべて解除しますか？')){spirits.forEach(s=>s.classList.remove('on'));update();filter()}}
async function saveImage(){
  const visible=spirits.filter(s=>!s.classList.contains('hidden'));
  if(!visible.length){alert('保存する精霊がありません');return}

  const cols=3,pad=45,gap=25,cw=420,ch=455;
  const rows=Math.ceil(visible.length/cols);

  const c=document.createElement('canvas');
  c.width=pad*2+cols*cw+(cols-1)*gap;
  c.height=pad*2+150+rows*ch+(rows-1)*gap;

  const x=c.getContext('2d');

  // 現在のチェックリストと同じ背景を使用
  const bg=new Image();
  bg.src=window.innerWidth<=600?'background-mobile.png':'background-v2.png';
  await new Promise(resolve=>{bg.onload=resolve});

  const scale=Math.max(c.width/bg.width,c.height/bg.height);
  const bw=bg.width*scale,bh=bg.height*scale;
  x.drawImage(bg,(c.width-bw)/2,(c.height-bh)/2,bw,bh);

  // タイトル
  const n=state().filter(Boolean).length;
  x.fillStyle='#fff';
  x.font='bold 38px sans-serif';
  x.font='bold 25px sans-serif';
  // 精霊
  for(let i=0;i<visible.length;i++){
    const s=visible[i],im=s.querySelector('img');
    const xx=pad+(i%cols)*(cw+gap);
    const yy=pad+150+Math.floor(i/cols)*(ch+gap);

    const owned=s.classList.contains('on');

    x.globalAlpha=owned?1:0.55;
    x.drawImage(im,xx+12,yy+12,cw-24,cw-24);
    x.globalAlpha=1;

    // 精霊名
    x.fillStyle='#fff';
    x.font='bold 22px sans-serif';
    x.textAlign='center';
    x.fillText(spiritNames[s.dataset.i-1],xx+cw/2,yy+ch-14);
    x.textAlign='start';

    // 取得済みの枠
    if(owned){
      x.strokeStyle='#e53935';
      x.lineWidth=6;
      x.beginPath();
      x.roundRect(xx,yy,cw,ch,18);
      x.stroke();
    }
  }

  const blob=await new Promise(resolve=>c.toBlob(resolve,'image/png'));

  if(!blob){
    alert('画像の作成に失敗しました');
    return;
  }

  const mobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

  if(mobile){
    const u=URL.createObjectURL(blob);

    const overlay=document.createElement('div');
    overlay.style.cssText=
      'position:fixed;inset:0;z-index:99999;background:#f6f7f9;padding:16px;overflow:auto;text-align:center;font-family:sans-serif;';

    overlay.innerHTML=
      '<p style="font-weight:bold;color:#20242a;font-size:18px;margin:0 0 14px">画像を長押しして保存してください</p>';

    const img=document.createElement('img');
    img.src=u;
    img.style.cssText=
      'display:block;width:100%;height:auto;margin:auto;border-radius:12px;';

    overlay.appendChild(img);
    document.body.appendChild(overlay);

    setTimeout(()=>URL.revokeObjectURL(u),60000);
    return;
  }

  const target=document.body;

const canvas=await html2canvas(target,{
  backgroundColor:null,
  useCORS:true,
  scale:window.devicePixelRatio
});

const u=canvas.toDataURL('image/png');
const a=document.createElement('a');
a.href=u;
a.download='精霊チェックリスト.png';
document.body.appendChild(a);
a.click();
a.remove();
}
load();
setView('all');
</script>
